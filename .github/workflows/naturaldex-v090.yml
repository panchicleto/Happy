name: Build NaturalDex v0.9.0 Gift Records

on:
  push:
    branches: [ main ]
    paths:
      - 'naturaldex-build/naturaldex_v090_src.b64'
      - '.github/workflows/naturaldex-v090.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout matching PKHeXth
        uses: actions/checkout@v4
        with:
          repository: hexbyt3/PKHeXth
          ref: afab45d8223f2c3356eae954c9179050c5d2f8ae
          path: pkhexth

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Decode NaturalDex source
        shell: pwsh
        run: |
          $b64 = (Get-Content "naturaldex-build/naturaldex_v090_src.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("naturaldex_v090_src.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "naturaldex_v090_src.zip" -DestinationPath "NaturalDexSource" -Force

      - name: Build matching PKHeX.Core
        shell: pwsh
        run: dotnet build "pkhexth/PKHeX.Core/PKHeX.Core.csproj" -c Release

      - name: Copy PKHeX.Core
        shell: pwsh
        run: |
          $core = Get-ChildItem "pkhexth/PKHeX.Core/bin/Release" -Recurse -Filter "PKHeX.Core.dll" | Select-Object -First 1
          if (-not $core) { throw "PKHeX.Core.dll not found" }
          New-Item -ItemType Directory -Force "NaturalDexSource/Deps" | Out-Null
          Copy-Item $core.FullName "NaturalDexSource/Deps/PKHeX.Core.dll" -Force

      - name: Build NaturalDex
        shell: pwsh
        run: dotnet build "NaturalDexSource/NaturalDex.Plugin.v0.5.0.csproj" -c Release -o "NaturalDexOut"

      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path "NaturalDexOut/NaturalDex.Plugin.dll")) { throw "NaturalDex.Plugin.dll not produced" }
          Copy-Item "NaturalDexOut/NaturalDex.Plugin.dll" "NaturalDex.Plugin.v0.9.0-GiftRecords-BoxStart.dll"
          Copy-Item "NaturalDexSource/CHANGELOG-v0.9.0.txt" "CHANGELOG-v0.9.0.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: NaturalDex-v0.9.0-GiftRecords-BoxStart
          path: |
            NaturalDex.Plugin.v0.9.0-GiftRecords-BoxStart.dll
            CHANGELOG-v0.9.0.txt
            NaturalDexOut/*.pdb
