name: Build NaturalDex v0.9.3 Strict Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'naturaldex-build/v093part00.txt'
      - '.github/workflows/naturaldex-v093.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout matching PKHeXth
        uses: actions/checkout@v4
        with:
          repository: hexbyt3/PKHeXth
          ref: afab45d8223f2c3356eae954c9179050c5d2f8ae
          path: pkhexth
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Reassemble NaturalDex source
        shell: pwsh
        run: |
          $b64 = Get-Content "naturaldex-build/v093part00.txt" -Raw
          [IO.File]::WriteAllBytes("naturaldex_v093_src.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "naturaldex_v093_src.zip" -DestinationPath "NaturalDexSource" -Force
      - name: Build matching PKHeX.Core
        shell: pwsh
        run: dotnet build "pkhexth/PKHeX.Core/PKHeX.Core.csproj" -c Release
      - name: Copy PKHeX.Core
        shell: pwsh
        run: |
          $core = Get-ChildItem "pkhexth/PKHeX.Core/bin/Release" -Recurse -Filter "PKHeX.Core.dll" | Select-Object -First 1
          if (-not $core) { throw "PKHeX.Core.dll not found" }
          New-Item -ItemType Directory -Force "NaturalDexSource/Deps" | Out-Null
          Copy-Item $core.FullName "NaturalDexSource/Deps/PKHeX.Core.dll" -Force
      - name: Build NaturalDex
        shell: pwsh
        run: dotnet build "NaturalDexSource/NaturalDex.Plugin.v0.5.0.csproj" -c Release -o "NaturalDexOut"
      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path "NaturalDexOut/NaturalDex.Plugin.dll")) { throw "NaturalDex.Plugin.dll not produced" }
          Copy-Item "NaturalDexOut/NaturalDex.Plugin.dll" "NaturalDex.Plugin.v0.9.3-StrictValidation.dll"
          Copy-Item "NaturalDexSource/CHANGELOG-v0.9.3.txt" "CHANGELOG-v0.9.3.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: NaturalDex-v0.9.3-StrictValidation
          path: |
            NaturalDex.Plugin.v0.9.3-StrictValidation.dll
            CHANGELOG-v0.9.3.txt
            NaturalDexOut/*.pdb
