name: Build NDX Tools v1.4.0

on:
  push:
    branches: [ ndx-tools-v140 ]
    paths:
      - 'naturaldex-build/apply-v110.ps1'
      - 'naturaldex-build/apply-v120.ps1'
      - 'naturaldex-build/apply-v130.ps1'
      - 'naturaldex-build/apply-v131.ps1'
      - 'naturaldex-build/apply-v140.ps1'
      - 'naturaldex-build/v120/**'
      - 'naturaldex-build/v130/**'
      - 'naturaldex-build/v131/**'
      - 'naturaldex-build/v140/**'
      - '.github/workflows/naturaldex-v140.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: hexbyt3/PKHeXth
          ref: afab45d8223f2c3356eae954c9179050c5d2f8ae
          path: pkhexth

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Reassemble clean v094 base
        shell: pwsh
        run: |
          $b64=git show 6a8192535fcca3fd0e447f114070c8564e28adc9:naturaldex-build/v093part00.txt
          [IO.File]::WriteAllBytes("src.zip",[Convert]::FromBase64String(($b64 -join "")))
          Expand-Archive src.zip NaturalDexSource -Force
          cmd /c "git -C NaturalDexSource apply --reject --recount --ignore-space-change ../naturaldex-build/v094.patch || exit /b 0"
          $p="NaturalDexSource/NaturalDex.Plugin/NaturalDexForm.cs"
          $c=Get-Content $p -Raw
          $c=$c.Replace('_strictValidation.Checked, (int)_startBox.Value, (int)_retries.Value)', '_strictValidation.Checked, true, (int)_startBox.Value, (int)_retries.Value)')
          Set-Content $p $c -Encoding UTF8

      - name: Apply v1.1 base fixes
        shell: pwsh
        run: ./naturaldex-build/apply-v110.ps1

      - name: Apply v1.2 event injector
        shell: pwsh
        run: ./naturaldex-build/apply-v120.ps1

      - name: Apply v1.3 tabs and local Wonder Cards
        shell: pwsh
        run: ./naturaldex-build/apply-v130.ps1

      - name: Apply v1.3.1 date fixes
        shell: pwsh
        run: ./naturaldex-build/apply-v131.ps1

      - name: Apply NDX Tools v1.4.0
        shell: pwsh
        run: ./naturaldex-build/apply-v140.ps1

      - name: Build PKHeX.Core
        shell: pwsh
        run: dotnet build pkhexth/PKHeX.Core/PKHeX.Core.csproj -c Release

      - name: Copy pinned PKHeX.Core
        shell: pwsh
        run: |
          $core=Get-ChildItem pkhexth/PKHeX.Core/bin/Release -Recurse -Filter PKHeX.Core.dll | Select-Object -First 1
          New-Item -ItemType Directory -Force NaturalDexSource/Deps | Out-Null
          Copy-Item $core.FullName NaturalDexSource/Deps/PKHeX.Core.dll -Force

      - name: Build NDX plugin
        shell: pwsh
        run: dotnet build NaturalDexSource/NaturalDex.Plugin.v0.5.0.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item out/NaturalDex.Plugin.dll package/NDX.Tools.v1.4.0.dll
          Get-FileHash package/NDX.Tools.v1.4.0.dll -Algorithm SHA256 | Format-List | Out-File package/NDX-Tools-v1.4.0.sha256.txt
          @"
          NDX Tools v1.4.0

          Base: NaturalDex v1.3.1.

          Included:
          - Existing Living Dex / natural encounter generator.
          - Existing Events / Wonder Cards manager and local Wonder Card import.
          - Existing event date validation and safe preflight/rollback flow.
          - New NDX Tools hub.
          - New read-only Save Auditor:
            * PKHeX LegalityAnalysis for box and party Pokemon.
            * save checksum status.
            * PID+EC duplicate/coherence warnings.
            * encounter type summary and Mystery Gift count.
            * future met-date warnings.
            * TXT report export.

          Safety:
          - Save Auditor does not modify the save.
          - No HOME tracker fabrication.
          - No forced illegal Pokemon.
          - Unverified blocks remain untouched.

          Installation:
          Copy NDX.Tools.v1.4.0.dll to the same PKHeXth plugins folder used by NaturalDex.
          Remove/rename the older NaturalDex plugin DLL so only one version is loaded.
          "@ | Set-Content package/README-NDX-Tools-v1.4.0.txt -Encoding UTF8

          New-Item -ItemType Directory -Force package/source | Out-Null
          Copy-Item NaturalDexSource/NaturalDex.Plugin/NDXSaveAuditor.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/NDXSuiteTabs.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/NaturalDexForm.Events.cs package/source/
          Compress-Archive -Path package/* -DestinationPath NDX-Tools-v1.4.0.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NDX-Tools-v1.4.0
          path: |
            NDX-Tools-v1.4.0.zip
            package/NDX.Tools.v1.4.0.dll
            package/NDX-Tools-v1.4.0.sha256.txt
            package/README-NDX-Tools-v1.4.0.txt
