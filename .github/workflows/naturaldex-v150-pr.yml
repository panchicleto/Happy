name: Validate NDX Tools v1.5.0 PR

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'naturaldex-build/apply-v110.ps1'
      - 'naturaldex-build/apply-v120.ps1'
      - 'naturaldex-build/apply-v130.ps1'
      - 'naturaldex-build/apply-v131.ps1'
      - 'naturaldex-build/apply-v140.ps1'
      - 'naturaldex-build/apply-v150.ps1'
      - 'naturaldex-build/v120/**'
      - 'naturaldex-build/v130/**'
      - 'naturaldex-build/v131/**'
      - 'naturaldex-build/v140/**'
      - 'naturaldex-build/v150/**'
      - '.github/workflows/naturaldex-v150-pr.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/checkout@v4
        with:
          repository: hexbyt3/PKHeXth
          ref: afab45d8223f2c3356eae954c9179050c5d2f8ae
          path: pkhexth

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }

      - name: Reassemble clean base
        shell: pwsh
        run: |
          $b64=git show 6a8192535fcca3fd0e447f114070c8564e28adc9:naturaldex-build/v093part00.txt
          [IO.File]::WriteAllBytes("src.zip",[Convert]::FromBase64String(($b64 -join "")))
          Expand-Archive src.zip NaturalDexSource -Force
          cmd /c "git -C NaturalDexSource apply --reject --recount --ignore-space-change ../naturaldex-build/v094.patch || exit /b 0"
          $p="NaturalDexSource/NaturalDex.Plugin/NaturalDexForm.cs"
          $c=Get-Content $p -Raw
          $c=$c.Replace('_strictValidation.Checked, (int)_startBox.Value, (int)_retries.Value)', '_strictValidation.Checked, true, (int)_startBox.Value, (int)_retries.Value)')
          Set-Content $p $c -Encoding UTF8

      - name: Apply NDX version chain
        shell: pwsh
        run: |
          ./naturaldex-build/apply-v110.ps1
          ./naturaldex-build/apply-v120.ps1
          ./naturaldex-build/apply-v130.ps1
          ./naturaldex-build/apply-v131.ps1
          ./naturaldex-build/apply-v140.ps1
          ./naturaldex-build/apply-v150.ps1

      - name: Build PKHeX.Core
        shell: pwsh
        run: dotnet build pkhexth/PKHeX.Core/PKHeX.Core.csproj -c Release

      - name: Copy pinned PKHeX.Core
        shell: pwsh
        run: |
          $core=Get-ChildItem pkhexth/PKHeX.Core/bin/Release -Recurse -Filter PKHeX.Core.dll | Select-Object -First 1
          New-Item -ItemType Directory -Force NaturalDexSource/Deps | Out-Null
          Copy-Item $core.FullName NaturalDexSource/Deps/PKHeX.Core.dll -Force

      - name: Build NDX plugin
        shell: pwsh
        run: dotnet build NaturalDexSource/NaturalDex.Plugin.v0.5.0.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/source | Out-Null
          Copy-Item out/NaturalDex.Plugin.dll package/NDX.Tools.v1.5.0.dll
          Get-FileHash package/NDX.Tools.v1.5.0.dll -Algorithm SHA256 | Format-List | Out-File package/NDX-Tools-v1.5.0.sha256.txt
          @"
          NDX Tools v1.5.0
          Base: NaturalDex v1.3.1

          INCLUDED IN ONE DLL
          - Living Dex / Natural Encounter Generator
          - Events / Wonder Cards / gift receipt history
          - Save Auditor
          - SWSH Raid Viewer / Editor (Galar, Isle of Armor, Crown Tundra)
          - Dynamax Adventure captured flags, noted species, Peonia hint and streaks
          - Crown Tundra resets: Regis, Swords of Justice/Keldeo, Galarian Birds
          - Curry Dex block import/export with size validation
          - PLA NPC/Farm PA8 scanner, extractor and replacement editor
          - SV Overworld 20-entry viewer and PK9 extraction
          - Legends Z-A Shiny Stash 10-entry viewer and PA9 extraction

          NOTES
          - Wonder Records functionality is absorbed by the Events/Wonder Cards module.
          - The SWSH raid module edits native raid structures; advanced external seed/frame search UI is not copied from the old Leanny DLL.
          - Z-A map rendering/live teleport is intentionally not written without validated sys-botbase connectivity.
          - All write modules use a working clone and NDX creates a backup before committing.
          "@ | Set-Content package/README-NDX-Tools-v1.5.0.txt -Encoding UTF8
          Copy-Item NaturalDexSource/NaturalDex.Plugin/NDXSwitchTools.Tab.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/SwShRaidToolForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/SwShAdventureToolForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/SVOverworldToolForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/ZAStashToolForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/PLANPCToolForm.cs package/source/
          Compress-Archive -Path package/* -DestinationPath NDX-Tools-v1.5.0.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NDX-Tools-v1.5.0
          path: |
            NDX-Tools-v1.5.0.zip
            package/NDX.Tools.v1.5.0.dll
            package/NDX-Tools-v1.5.0.sha256.txt
            package/README-NDX-Tools-v1.5.0.txt
