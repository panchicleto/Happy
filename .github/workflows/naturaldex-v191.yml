name: Build NDX Tools v1.9.1

on:
  push:
    branches: [ ndx-tools-v191 ]
    paths:
      - 'naturaldex-build/apply-v191.ps1'
      - 'naturaldex-build/v191/**'
      - '.github/workflows/naturaldex-v191.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: hexbyt3/PKHeXth
          ref: afab45d8223f2c3356eae954c9179050c5d2f8ae
          path: pkhexth

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Reassemble clean NaturalDex base
        shell: pwsh
        run: |
          $b64=git show 6a8192535fcca3fd0e447f114070c8564e28adc9:naturaldex-build/v093part00.txt
          [IO.File]::WriteAllBytes("src.zip",[Convert]::FromBase64String(($b64 -join "")))
          Expand-Archive src.zip NaturalDexSource -Force
          cmd /c "git -C NaturalDexSource apply --reject --recount --ignore-space-change ../naturaldex-build/v094.patch || exit /b 0"
          $p="NaturalDexSource/NaturalDex.Plugin/NaturalDexForm.cs"
          $c=Get-Content $p -Raw
          $c=$c.Replace('_strictValidation.Checked, (int)_startBox.Value, (int)_retries.Value)', '_strictValidation.Checked, true, (int)_startBox.Value, (int)_retries.Value)')
          Set-Content $p $c -Encoding UTF8

      - name: Apply NDX chain
        shell: pwsh
        run: |
          ./naturaldex-build/apply-v110.ps1
          ./naturaldex-build/apply-v120.ps1
          ./naturaldex-build/apply-v130.ps1
          ./naturaldex-build/apply-v131.ps1
          ./naturaldex-build/apply-v140.ps1
          ./naturaldex-build/apply-v150.ps1
          ./naturaldex-build/apply-v160.ps1
          ./naturaldex-build/apply-v170.ps1
          ./naturaldex-build/apply-v180.ps1
          ./naturaldex-build/apply-v181.ps1
          ./naturaldex-build/apply-v182.ps1
          ./naturaldex-build/apply-v183.ps1
          ./naturaldex-build/apply-v184.ps1
          ./naturaldex-build/apply-v186.ps1
          ./naturaldex-build/apply-v187.ps1
          ./naturaldex-build/apply-v188.ps1
          ./naturaldex-build/apply-v190.ps1

      - name: Build PKHeX.Core 26.7.7.0
        shell: pwsh
        run: dotnet build pkhexth/PKHeX.Core/PKHeX.Core.csproj -c Release

      - name: Verify exact PKHeX.Core version
        shell: pwsh
        run: |
          $core=Get-ChildItem pkhexth/PKHeX.Core/bin/Release -Recurse -Filter PKHeX.Core.dll | Select-Object -First 1
          $v=[Reflection.AssemblyName]::GetAssemblyName($core.FullName).Version.ToString()
          Write-Host "PKHeX.Core build version: $v"
          if ($v -ne "26.7.7.0") { throw "Expected PKHeX.Core 26.7.7.0, got $v" }
          New-Item -ItemType Directory -Force NaturalDexSource/Deps | Out-Null
          Copy-Item $core.FullName NaturalDexSource/Deps/PKHeX.Core.dll -Force

      - name: Build NDX plugin
        shell: pwsh
        run: dotnet build NaturalDexSource/NaturalDex.Plugin.v0.5.0.csproj -c Release -o out

      - name: Package NDX v1.9.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/source | Out-Null
          Copy-Item out/NaturalDex.Plugin.dll package/NDX.Tools.v1.9.1.dll
          Get-FileHash package/NDX.Tools.v1.9.1.dll -Algorithm SHA256 | Format-List | Out-File package/NDX-Tools-v1.9.1.sha256.txt
          @"
          NDX Tools v1.9.1
          Target PKHeX / PKHeX.Core: 26.7.7.0

          New in v1.9.1:
          - Named Box Manager inside HOME Collections.
          - Displays each box using the real name stored in the save plus occupied/empty/capacity counts.
          - Select one or multiple boxes and empty only those boxes.
          - Separate guarded action to empty ALL boxes.
          - Box names and wallpapers are preserved; party Pokémon are untouched.
          - Changes are staged on a clone, verified empty, audited for box-name preservation, backed up and byte-audited before commit.
          - HOME Collections Manager tab with collection audit, missing-item tracking and manifests.
          - Generator presets: Shiny OrigiDex, Game Origin, Generation Dex, Starters, Fossils,
            Pseudo-Legendaries, Baby Pokemon, Legendary + Mythical, plus BallDex selected-ball runs.
          - Tracker presets: Regional FormDex, Complete FormDex, Vivillon, Alcremie, Gender Pair,
            Shiny Gender Pair, Apriball Matrix, Safari/Sport/Beast, EventDex, Mythical EventDex,
            AlphaDex, MarkDex, Ribbon collection, GO Origin, Language, OT, Evolution Archive and Ultimate HOME.
          - CSV and .ndxhome.json manifest export.
          - Collection scanner checks boxes and reports owned, missing, current-game compatible and external entries.
          - HOME Tracker values are never fabricated; HOME assigns its own data after legitimate transfer.
          - Existing sister-version checkbox is now honored for Game Origin presets.
          - New OrigiDex layout: generate only species that first debuted in the region of the opened game.
          - Pokémon Black/White and Black 2/White 2: Teselia/Unova #494 Victini through #649 Genesect.
          - Remakes map to their actual region (FRLG/LGPE Kanto, HGSS Johto, ORAS Hoenn, BDSP Sinnoh).
          - Strict region rules: Alola #722-807, Galar #810-898, Hisui #899-905, Paldea #906-1010.
          - Regional forms of older species are not counted as new species.
          - Uses the same legal generation, shiny, event, gap-preservation and backup pipeline as the existing Living Dex.
          - Wonder Card catalog now shows only cards belonging to the currently opened game.
          - Separate actions: RECOMPENSA + HISTORIAL or REGISTRAR SOLO EN HISTORIAL.
          - History-only mode writes the Mystery Gift receipt but does not add Pokemon, items, clothing, money, BP/LP or other rewards.
          - Receipt-only mode uses clone preflight, automatic save backup and post-commit audit.
          - Z-A WA9 history-only writing remains disabled until its receipt layout is publicly verified.
          - Includes all v1.8.6 features with regression guards.
          - Regression fix: restores every feature present through v1.8.4.
          - Wonder Card history manager is now inserted additively instead of replacing NaturalDexForm.Events.cs.
          - Preserves NDX Suite tabs, Switch Tools, compatibility checks, Trainer Card album/gallery/Game Style viewer and pokeldn bridge.
          - Wonder Card / Mystery Gift history manager in the Events tab.
          - Safe clear-all history option for Sword/Shield, BDSP, Legends Arceus and Scarlet/Violet.
          - Sword/Shield clears only the dedicated 0x112D5141 Mystery Gift block.
          - PLA/SV clear only the dedicated 0x99E1625E Mystery Gift block.
          - BDSP clears received entries, receive flags, OneDay records and serial lock using MysteryBlock8b.
          - Rewards already granted (Pokemon, items, clothing, money, BP/LP, etc.) are intentionally preserved.
          - Works on a cloned save first, creates an automatic full-save backup, then performs byte-for-byte commit audit.
          - Legends Z-A is shown but write/clear remains disabled until the WA9 history layout is verified.
          - Includes all v1.8.4 Game Style League Card Viewer features.
          - Game Style Sword/Shield League Card viewer.
          - Front/reverse card rendering inspired by the in-game album presentation.
          - Flip-card interaction and PNG preview export.
          - Uses real TrainerCard8 front/back data from the loaded card.
          - Reads appearance/outfit IDs: skin, hair, brows, lashes, contacts, lips, glasses, hat,
            jacket, top, bag, gloves, bottom/dress, socks and shoes.
          - Uses PKHeX's own Pokemon sprite renderer at runtime when available.
          - Reverse view displays the six showcase Pokemon, starter, Dex count, start date,
            Curry Dex, Rotom Rally score, caught Pokemon, shinies, ID, uniform number and trainer name.
          - Explicitly marks the trainer/front visual as reconstructed while exact 3D pose/background/effects remain undecoded.
          - Direct game-style viewer from own card, selected album card and gallery.
          - Includes all v1.8.3 gallery/support features.
          - Visual Sword/Shield League Card gallery.
          - Card-style browsing for all 300 album slots.
          - Filters: compatible, warnings, Sword, Shield, empty.
          - Search by trainer name, Trainer Card ID or slot.
          - Per-card support inspector with known/editable vs preserved-only fields.
          - Validation warnings for game, language, dates, IDs and showcase Pokemon.
          - Direct edit/export/--card-set actions from each card.
          - Includes all v1.8.2 pokeldn League Card bridge features.
          - pokeldn-compatible Sword/Shield League Card bridge.
          - Reads full 3456-byte pokeldn SWSH trade snapshots.
          - Reads 2965-byte short snapshots and inflates the zlib third fragment.
          - Extracts/injects the 0x1D0 League Card at snapshot offset 0x924.
          - Structured Trainer Card editor preserving unknown bytes.
          - Edits trainer identity, card stats, dates, Dex flags and six showcase Pokemon.
          - Generates pokeldn --card-set arguments for the current or selected card.
          - Snapshot -> album slot import with preview/edit.
          - Current/selected card -> expanded pokeldn snapshot export.
          - Includes all v1.8.1 Trainer Card Album features.
          - Sword/Shield Trainer Card Album tool.
          - Uses the native KFriendLeagueCards block (0x28E707F5).
          - 300 album slots, each matching TrainerCard8 raw size 0x1D0.
          - Export current player Trainer Card as .lc8.
          - Copy current player card into the album.
          - Export/import individual album cards as .lc8.
          - Bulk export all occupied cards.
          - Bulk import a folder of .lc8 cards into free slots.
          - Full album backup/restore as .lc8album (0x21FC0 bytes).
          - Slot overwrite confirmation and post-write byte audit.
          - Displays OT, six-digit Trainer Card ID, Sword/Shield, card number and printed timestamp.

          Includes all v1.8.0 features: NaturalDex, Events/Wonder Cards, Save Auditor,
          SWSH Raids/Seed Finder/Dynamax Adventure/Crown Tundra/Curry/Poke Camp,
          BDSP event rewards/clothing, PLA NPC/Farm + WA8 clothing,
          SV Overworld reconstruction and Legends Z-A tools/WA9 support.
          "@ | Set-Content package/README-NDX-Tools-v1.9.1.txt -Encoding UTF8

          Copy-Item NaturalDexSource/NaturalDex.Plugin/SwShTrainerCardAlbumForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/NaturalDexForm.Events.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/WonderCardHistoryManagerForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/WonderCardSelectionForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/WonderCardInjectionService.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/OrigiDexCatalog.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/HomeCollectionCatalog.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/HomeCollectionsTab.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/HomeBoxManagerForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/SwShTrainerCardGalleryForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/SwShLeagueCardGameViewForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/SwShTrainerCardGalleryForm.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/SwShPokeLdnCardBridge.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/NDXSwitchTools.Tab.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/WonderCardInjectionService.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/WonderCardCatalog.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/SVOverworldReconstructor.cs package/source/
          Copy-Item NaturalDexSource/NaturalDex.Plugin/ZASpawnerMapLoader.cs package/source/

          Compress-Archive -Path package/* -DestinationPath NDX-Tools-v1.9.1.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NDX-Tools-v1.9.1
          path: |
            NDX-Tools-v1.9.1.zip
            package/NDX.Tools.v1.9.1.dll
            package/NDX-Tools-v1.9.1.sha256.txt
            package/README-NDX-Tools-v1.9.1.txt
