name: Dump NDX v1.8.8 Assembled Source

on:
  push:
    branches: [ ndx-tools-v190 ]
    paths:
      - '.github/workflows/source-dump-v190.yml'

jobs:
  dump:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hexbyt3/PKHeXth
          ref: afab45d8223f2c3356eae954c9179050c5d2f8ae
          path: pkhexth
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Reassemble clean NaturalDex base
        shell: pwsh
        run: |
          $b64 = Get-Content naturaldex-build/v093part00.txt -Raw
          [IO.File]::WriteAllBytes("NaturalDex-v093.zip", [Convert]::FromBase64String($b64))
          Expand-Archive NaturalDex-v093.zip -DestinationPath NaturalDexSource -Force
      - name: Apply current NDX chain
        shell: pwsh
        run: |
          ./naturaldex-build/apply-v094.ps1
          ./naturaldex-build/apply-v095.ps1
          ./naturaldex-build/apply-v110.ps1
          ./naturaldex-build/apply-v120.ps1
          ./naturaldex-build/apply-v130.ps1
          ./naturaldex-build/apply-v131.ps1
          ./naturaldex-build/apply-v140.ps1
          ./naturaldex-build/apply-v150.ps1
          ./naturaldex-build/apply-v160.ps1
          ./naturaldex-build/apply-v170.ps1
          ./naturaldex-build/apply-v180.ps1
          ./naturaldex-build/apply-v181.ps1
          ./naturaldex-build/apply-v182.ps1
          ./naturaldex-build/apply-v183.ps1
          ./naturaldex-build/apply-v184.ps1
          ./naturaldex-build/apply-v186.ps1
          ./naturaldex-build/apply-v187.ps1
          ./naturaldex-build/apply-v188.ps1
      - name: Package assembled source
        shell: pwsh
        run: |
          Compress-Archive -Path NaturalDexSource/* -DestinationPath NDX-v188-Assembled-Source.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NDX-v188-Assembled-Source
          path: NDX-v188-Assembled-Source.zip
